<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frank Junior Benítez Mosquera — Análisis y Desarrollo de Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .gothic { font-family: 'UnifrakturCook','UnifrakturMaguntia','Old English Text MT','Blackadder ITC','Goudy Text MT',Georgia,'Times New Roman',serif; font-weight: 700; }
    .cond   { font-family: 'Oswald','Bebas Neue','Arial Narrow','Segoe UI',Arial,sans-serif; font-weight: 700; }
    .sans   { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }

    .rise { opacity: 0; animation: rise .9s ease forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s } .d5 { animation-delay: .7s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .sq { fill: #fff; fill-opacity: .16; animation: float 9s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0);     opacity: .25; }
      50%      { transform: translateY(-22px); opacity: 1;   }
    }

    .ring  { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { stroke-opacity: .12; } 50% { stroke-opacity: .38; } }

    .sheen { animation: sheen 7s ease-in-out infinite; }
    @keyframes sheen { 0% { transform: translateX(0); } 45%, 100% { transform: translateX(900px); } }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(520px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c9c9cc"/><stop offset="1" stop-color="#6f6f74"/>
    </linearGradient>
    <linearGradient id="silver2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e0e2"/><stop offset="1" stop-color="#8a8a8f"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0" x2="1"><stop offset="0" stop-color="#8a8a8f" stop-opacity="0"/><stop offset="1" stop-color="#8a8a8f" stop-opacity=".85"/></linearGradient>
    <linearGradient id="lineR" x1="0" x2="1"><stop offset="0" stop-color="#8a8a8f" stop-opacity=".85"/><stop offset="1" stop-color="#8a8a8f" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheenG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".035"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="nameClip"><text x="600" y="355" text-anchor="middle" font-size="150" class="gothic">Frank</text></clipPath>
    <clipPath id="card"><rect width="1200" height="520" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="520" fill="#060605"/>
    <rect width="1200" height="520" fill="url(#grid)"/>
    <rect width="1200" height="520" fill="url(#glow)"/>
    <rect class="scan" y="-80" width="1200" height="80" fill="url(#scanG)"/>

    <!-- cuadrados flotantes -->
    <g>
      <g transform="translate(110 70) rotate(20)"><rect class="sq" x="-9" y="-9" width="18" height="18" style="animation-duration:9s"/></g>
      <g transform="translate(460 40) rotate(35)"><rect class="sq" x="-7" y="-7" width="14" height="14" style="animation-duration:8s;animation-delay:-2s"/></g>
      <g transform="translate(905 85) rotate(15)"><rect class="sq" x="-11" y="-11" width="22" height="22" style="animation-duration:10s;animation-delay:-4s"/></g>
      <g transform="translate(1050 255) rotate(40)"><rect class="sq" x="-8" y="-8" width="16" height="16" style="animation-duration:9s;animation-delay:-1s"/></g>
      <g transform="translate(300 255) rotate(25)"><rect class="sq" x="-12" y="-12" width="24" height="24" style="animation-duration:11s;animation-delay:-5s"/></g>
      <g transform="translate(160 430) rotate(10)"><rect class="sq" x="-10" y="-10" width="20" height="20" style="animation-duration:10s;animation-delay:-3s"/></g>
      <g transform="translate(1110 420) rotate(30)"><rect class="sq" x="-8" y="-8" width="16" height="16" style="animation-duration:8s;animation-delay:-6s"/></g>
      <g transform="translate(700 480) rotate(45)"><rect class="sq" x="-13" y="-13" width="26" height="26" style="animation-duration:12s;animation-delay:-2s"/></g>
      <g transform="translate(900 335) rotate(18)"><rect class="sq" x="-7" y="-7" width="14" height="14" style="animation-duration:9s;animation-delay:-7s"/></g>
      <g transform="translate(60 255) rotate(28)"><rect class="sq" x="-6" y="-6" width="12" height="12" style="animation-duration:7s;animation-delay:-4s"/></g>
    </g>

    <!-- línea superior -->
    <g class="rise d1">
      <rect x="330" y="85" width="70" height="1" fill="url(#lineL)"/>
      <rect x="800" y="85" width="70" height="1" fill="url(#lineR)"/>
      <text x="600" y="90" text-anchor="middle" class="sans" font-size="12" letter-spacing="3.4" fill="#8a8a8f">MEDELLÍN, COLOMBIA  ·  DISPONIBLE AHORA</text>
    </g>

    <!-- medallón -->
    <g class="rise d2">
      <circle cx="600" cy="170" r="50" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-width="1.5" class="ring"/>
      <text x="600" y="192" text-anchor="middle" font-size="62" class="gothic" fill="url(#silver)">F</text>
    </g>

    <!-- nombre + brillo -->
    <g class="rise d3">
      <text x="600" y="355" text-anchor="middle" font-size="150" class="gothic" fill="url(#silver)">Frank</text>
      <g clip-path="url(#nameClip)"><polygon class="sheen" points="230,200 300,200 260,370 190,370" fill="url(#sheenG)"/></g>
    </g>

    <!-- apellidos -->
    <text class="rise d4 cond" x="600" y="414" text-anchor="middle" font-size="34" letter-spacing="11" fill="url(#silver2)">JUNIOR BENÍTEZ MOSQUERA</text>

    <!-- rol -->
    <text class="rise d5 sans" x="600" y="468" text-anchor="middle" font-size="15" letter-spacing="3.5" fill="#77777c">ANÁLISIS &amp; DESARROLLO DE SOFTWARE   ·   CREATIVE TECHNOLOGIST</text>

    <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
  </g>
</svg>
